# Approach B / B1 on KAGGLE: NISQA + TMHINT (BVCC dropped), RAW MOS.
# Domain-closer training data; mel-on + no-rank (the mel-experiment winner).
# Shares the encoder cache with B2 (same audio -> same features; only labels differ).
model:
  whisper_model: "openai/whisper-medium"
  proj_dim: 256
  dropout: 0.1
  encoder_layer: -1
  use_mel_branch: true

training:
  train_manifest: "data/manifests/pretrain_train.csv"
  dev_manifest: "data/manifests/pretrain_dev.csv"
  batch_size: 16
  epochs: 10
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_gamma: 0.9999
  ccr_lambda: 0.0
  ccr_lambda_ramp_epochs: 0
  acr_rank_alpha: 0.0
  cache_dir: "/kaggle/temp/encoder_cache_b"
  checkpoint_dir: "/kaggle/working/checkpoints/exp_b1"
  checkpoint_every_n_epochs: 2
  early_stop_patience: 3
  num_workers: 4

logging:
  run_name: "exp-b1-nisqa-tmhint-raw"
