# Approach A / Experiment A2: rank loss + encoder layer 12, mel branch OFF.
# Requires the layer-12 feature cache (data/encoder_cache_layer12).
model:
  whisper_model: "openai/whisper-medium"
  proj_dim: 256
  dropout: 0.1
  encoder_layer: 12
  use_mel_branch: false

training:
  train_manifest: "data/manifests/pretrain_train.csv"
  dev_manifest: "data/manifests/pretrain_dev.csv"
  batch_size: 16
  epochs: 15
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_gamma: 0.9999
  ccr_lambda: 0.0
  ccr_lambda_ramp_epochs: 0
  acr_rank_alpha: 1.0
  cache_dir: "data/encoder_cache_layer12"
  checkpoint_dir: "checkpoints/exp_a2_l12"
  drive_checkpoint_dir: "/content/drive/MyDrive/voicemos2026/checkpoints/exp_a2_l12"
  checkpoint_every_n_epochs: 5
  num_workers: 2

logging:
  run_name: "exp-a2-layer12-nomel"
